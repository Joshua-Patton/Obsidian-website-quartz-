name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install Dependencies
        run: npm ci

      # Temporary fix for Quartz v5 folder-note wikilinks.
      # Fixes links such as [[groups]] when the note is:
      # Algebra/groups/groups.md
      - name: Patch Quartz folder-note links
        run: |
          node <<'EOF'
          const fs = require("fs");

          const file = "node_modules/@quartz-community/utils/dist/path.js";
          let s = fs.readFileSync(file, "utf8");

          const oldDecl =
            "const matchingFileNames = opts.allSlugs.filter((slug) => {";

          const newDecl =
            "let matchingFileNames = opts.allSlugs.filter((slug) => {";

          if (s.includes(oldDecl)) {
            s = s.replace(oldDecl, newDecl);
          }

          const marker =
            "if (matchingFileNames.length === 1) {";

          const patch = `
          // Fix Quartz v5 short wikilinks to folder notes.
          // Foo/Foo.md becomes Foo/index internally.
          // This allows [[Foo]] to find Foo/index.
          if (matchingFileNames.length === 0 && !isMultiSegment) {
            matchingFileNames = opts.allSlugs.filter((slug) => {
              const parts = slug.split("/");
              return (
                parts.at(-1) === "index" &&
                parts.at(-2) === targetCanonical
              );
            });
          }

          `;

          if (
            !s.includes(
              "Fix Quartz v5 short wikilinks to folder notes"
            )
          ) {
            const start = s.indexOf(newDecl);
            const pos = s.indexOf(marker, start);

            if (start === -1 || pos === -1) {
              throw new Error(
                "Could not find Quartz shortest-link resolver. Patch not applied."
              );
            }

            s =
              s.slice(0, pos) +
              patch +
              s.slice(pos);
          }

          fs.writeFileSync(file, s);

          console.log(
            "Quartz folder-note link patch applied."
          );
          EOF

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4