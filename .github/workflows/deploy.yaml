name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      # Temporary fix for:
      # https://github.com/quartz-community/utils/issues/4
      #
      # Quartz turns:
      #
      #   Algebra/groups/groups.md
      #
      # into:
      #
      #   Algebra/groups/index
      #
      # but utils 1.0.1 fails to resolve [[groups]] to it.

      - name: Patch Quartz folder-note links
        run: |
          node <<'EOF'
          const fs = require("fs");

          const files = [
            "node_modules/@quartz-community/utils/dist/path.js",
            "node_modules/@quartz-community/utils/dist/index.js"
          ];

          const PATCH_MARKER =
            "QUARTZ_FOLDER_NOTE_SHORTEST_LINK_FIX";

          let patchedFiles = 0;

          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.log(`Skipping missing file: ${file}`);
              continue;
            }

            let source = fs.readFileSync(file, "utf8");

            if (source.includes(PATCH_MARKER)) {
              console.log(`Patch already present: ${file}`);
              patchedFiles++;
              continue;
            }

            const constDeclaration =
              "const matchingFileNames = opts.allSlugs.filter((slug) => {";

            const letDeclaration =
              "let matchingFileNames = opts.allSlugs.filter((slug) => {";

            let resolverStart = source.indexOf(constDeclaration);

            if (resolverStart !== -1) {
              source = source.replace(
                constDeclaration,
                letDeclaration
              );

              resolverStart = source.indexOf(letDeclaration);
            } else {
              resolverStart = source.indexOf(letDeclaration);
            }

            if (resolverStart === -1) {
              console.log(
                `Shortest resolver not present in ${file}`
              );
              continue;
            }

            const successMarker =
              "if (matchingFileNames.length === 1) {";

            const insertionPoint = source.indexOf(
              successMarker,
              resolverStart
            );

            if (insertionPoint === -1) {
              console.log(
                `Could not find insertion point in ${file}`
              );
              continue;
            }

            const patch = `
            // QUARTZ_FOLDER_NOTE_SHORTEST_LINK_FIX
            //
            // A folder note Foo/Foo.md becomes Foo/index.
            // For a short [[Foo]] link, retry using the
            // parent folder name when no normal file matched.
            if (
              matchingFileNames.length === 0 &&
              !isMultiSegment
            ) {
              matchingFileNames =
                opts.allSlugs.filter((slug) => {
                  const parts = slug.split("/");

                  return (
                    parts.at(-1) === "index" &&
                    parts.at(-2) === targetCanonical
                  );
                });
            }

            `;

            source =
              source.slice(0, insertionPoint) +
              patch +
              source.slice(insertionPoint);

            fs.writeFileSync(file, source);

            console.log(`Patched: ${file}`);
            patchedFiles++;
          }

          if (patchedFiles === 0) {
            throw new Error(
              "Could not patch any Quartz utils implementation."
            );
          }

          console.log(
            `Quartz patch completed. Patched ${patchedFiles} file(s).`
          );
          EOF

      # This is the important part:
      # verify the function Quartz actually imports.

      - name: Test Quartz folder-note resolver
        run: |
          node --input-type=module <<'EOF'
          import {
            transformLink
          } from "@quartz-community/utils";

          const allSlugs = [
            "Algebra/index",
            "Algebra/groups/index",
            "Algebra/groups/Foundations/index",
            "Algebra/fields/index"
          ];

          const result = transformLink(
            "Algebra/index",
            "groups",
            {
              strategy: "shortest",
              allSlugs
            }
          );

          console.log(
            `[[groups]] resolved to: ${result}`
          );

          if (
            result === "../groups" ||
            result === "/groups" ||
            result === "groups"
          ) {
            throw new Error(
              `FAILED: [[groups]] still resolves incorrectly to "${result}"`
            );
          }

          if (!result.includes("groups")) {
            throw new Error(
              `FAILED: unexpected result "${result}"`
            );
          }

          console.log(
            "Folder-note resolver test PASSED."
          );
          EOF

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4