name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Cache Quartz plugins
        uses: actions/cache@v5
        with:
          path: .quartz/plugins
          key: ${{ runner.os }}-plugins-${{ hashFiles('quartz.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-plugins-

      - name: Install dependencies
        run: npm ci

      - name: Install Quartz plugins
        run: npx quartz plugin install

      # -------------------------------------------------------
      # Temporary fix for Quartz v5 folder-note wikilinks
      #
      # Example:
      #
      #   [[groups]]
      #
      # from:
      #
      #   Algebra/Algebra.md
      #
      # should resolve to:
      #
      #   /algebra/groups/
      #
      # when the note is:
      #
      #   Algebra/groups/groups.md
      #
      # Quartz internally turns that folder note into:
      #
      #   Algebra/groups/index
      #
      # The current shortest-link resolver fails to match
      # "groups" against that /index slug.
      #
      # We patch both Quartz utils and the bundled copy inside
      # crawl-links.
      # -------------------------------------------------------

      - name: Patch Quartz folder-note links
        run: |
          node <<'EOF'
          const fs = require("fs");

          const files = [
            "node_modules/@quartz-community/utils/dist/path.js",
            "node_modules/@quartz-community/utils/dist/index.js",
            "node_modules/@quartz-community/crawl-links/dist/index.js"
          ];

          const PATCH_MARKER =
            "QUARTZ_FOLDER_NOTE_SHORTEST_LINK_FIX";

          let patchedFiles = 0;

          for (const file of files) {
            if (!fs.existsSync(file)) {
              console.log(`Skipping missing file: ${file}`);
              continue;
            }

            let source = fs.readFileSync(file, "utf8");

            if (source.includes(PATCH_MARKER)) {
              console.log(`Patch already present: ${file}`);
              patchedFiles++;
              continue;
            }

            const constDeclaration =
              "const matchingFileNames = opts.allSlugs.filter((slug) => {";

            const letDeclaration =
              "let matchingFileNames = opts.allSlugs.filter((slug) => {";

            let resolverStart =
              source.indexOf(constDeclaration);

            if (resolverStart !== -1) {
              source = source.replace(
                constDeclaration,
                letDeclaration
              );

              resolverStart =
                source.indexOf(letDeclaration);
            } else {
              resolverStart =
                source.indexOf(letDeclaration);
            }

            if (resolverStart === -1) {
              console.log(
                `Shortest resolver not present in ${file}`
              );
              continue;
            }

            const successMarker =
              "if (matchingFileNames.length === 1) {";

            const insertionPoint =
              source.indexOf(
                successMarker,
                resolverStart
              );

            if (insertionPoint === -1) {
              console.log(
                `Could not find insertion point in ${file}`
              );
              continue;
            }

            const patch = `
            // QUARTZ_FOLDER_NOTE_SHORTEST_LINK_FIX
            //
            // Foo/Foo.md becomes Foo/index internally.
            //
            // When [[Foo]] did not match a normal file,
            // look for an index slug whose parent folder
            // is named Foo.
            if (
              matchingFileNames.length === 0 &&
              !isMultiSegment
            ) {
              matchingFileNames =
                opts.allSlugs.filter((slug) => {
                  const parts = slug.split("/");

                  return (
                    parts.at(-1) === "index" &&
                    parts.at(-2) === targetCanonical
                  );
                });
            }

            `;

            source =
              source.slice(0, insertionPoint) +
              patch +
              source.slice(insertionPoint);

            fs.writeFileSync(file, source);

            console.log(`Patched: ${file}`);
            patchedFiles++;
          }

          if (patchedFiles === 0) {
            throw new Error(
              "Could not patch any Quartz resolver implementation."
            );
          }

          console.log(
            `Quartz patch completed. ${patchedFiles} file(s) patched.`
          );
          EOF

      # -------------------------------------------------------
      # Test the exported Quartz resolver itself
      # -------------------------------------------------------

      - name: Test Quartz folder-note resolver
        run: |
          node --input-type=module <<'EOF'
          import {
            transformLink
          } from "@quartz-community/utils";

          const allSlugs = [
            "Algebra/index",
            "Algebra/groups/index",
            "Algebra/groups/Foundations/index",
            "Algebra/fields/index"
          ];

          const result = transformLink(
            "Algebra/index",
            "groups",
            {
              strategy: "shortest",
              allSlugs
            }
          );

          console.log(
            `[[groups]] resolved to: ${result}`
          );

          if (
            result === "../groups" ||
            result === "/groups" ||
            result === "groups"
          ) {
            throw new Error(
              `FAILED: [[groups]] resolved incorrectly to "${result}"`
            );
          }

          if (!result.includes("groups")) {
            throw new Error(
              `FAILED: unexpected resolver result "${result}"`
            );
          }

          console.log(
            "Quartz resolver test PASSED."
          );
          EOF

      # -------------------------------------------------------
      # Build the real site
      # -------------------------------------------------------

      - name: Build Quartz
        run: npx quartz build

      # -------------------------------------------------------
      # Test the ACTUAL generated Algebra page.
      #
      # This is the important final test. Even if the synthetic
      # resolver test succeeds, deployment will fail if the
      # generated HTML still contains ../groups.
      # -------------------------------------------------------

      - name: Verify generated folder-note links
        run: |
          node <<'EOF'
          const fs = require("fs");

          const file = "public/algebra/index.html";

          if (!fs.existsSync(file)) {
            throw new Error(
              `Generated Algebra page not found: ${file}`
            );
          }

          const html =
            fs.readFileSync(file, "utf8");

          console.log(
            "Checking generated Algebra page..."
          );

          const badLinks = [
            'href="../groups"',
            'href="/groups"',
            'href="groups"'
          ];

          for (const bad of badLinks) {
            if (html.includes(bad)) {
              throw new Error(
                `FAILED: generated Algebra page contains broken link ${bad}`
              );
            }
          }

          const correctPatterns = [
            "../algebra/groups/",
            "/algebra/groups/",
            "algebra/groups/"
          ];

          const foundCorrect =
            correctPatterns.some(
              (pattern) =>
                html.includes(pattern)
            );

          if (!foundCorrect) {
            throw new Error(
              "FAILED: generated Algebra page does not contain the correct algebra/groups link."
            );
          }

          console.log(
            "Generated [[groups]] link is correct."
          );

          console.log(
            "Folder-note HTML verification PASSED."
          );
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4